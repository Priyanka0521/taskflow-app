server.port=${PORT:5000}

# --- Datasource ---
# By default we use the embedded H2 in-memory database for zero-config dev mode.
# To use MySQL, comment the H2 block and uncomment the MySQL block below.

# --- H2 (default, no install required) ---
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (swap in for production / persistent data) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=swynex-super-secret-jwt-key-please-change-me-in-production-this-is-at-least-256-bits-long
jwt.expiration-ms=604800000

# --- Logging ---
logging.level.com.taskflow=INFO
